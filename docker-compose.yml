services:
  stock-data:
    build:
      context: ./services/stock-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      FUND_DATA_DIR: /app/data
      FUND_API_KEY: ${FUND_API_KEY:-}
      STOCK_SDK_URL: http://stock-data:3000
      ELTDX_ENABLED: ${ELTDX_ENABLED:-1}
    volumes:
      - fund-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      stock-data:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      FUND_DATA_DIR: /app/data
      API_BASE_URL: http://backend:8000
      FUND_API_KEY: ${FUND_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - fund-data:/app/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fund-data:
