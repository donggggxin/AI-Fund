services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      FUND_DATA_DIR: /app/data
      FUND_API_KEY: ${FUND_API_KEY:-}
    volumes:
      - fund-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      FUND_DATA_DIR: /app/data
      API_BASE_URL: http://backend:8000
      FUND_API_KEY: ${FUND_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - fund-data:/app/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fund-data:
